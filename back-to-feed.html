<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Details</title>
  <link rel="stylesheet" href="./style.scss/styles.css" />
</head>

<body>

 <header>
            <div class="sticky_head">
            <div class="logo">
                <div class="logo_img">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#310de3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-codesandbox-icon lucide-codesandbox"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="7.5 4.21 12 6.81 16.5 4.21"/><polyline points="7.5 19.79 7.5 14.6 3 12"/><polyline points="21 12 16.5 14.6 16.5 19.79"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" x2="12" y1="22.08" y2="12"/></svg>
                </div>
                <div class="logo_content"><span>DevConnect</span></div>
            </div>
            <div class="menu">
                <span class="feed">
                    
                        <a href="index.html">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house-icon lucide-house"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                            <span>
                                Feed
                            </span>
                        </a>
                       
                </span>
                <span class="explore">
                    
                        <a href="explore.html">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#310de3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                            <span>
                                Explore
                            </span>
                        </a>
                    
                </span>    
                <span class="create_post">
                    
                    
                        <a href="create_post.html">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#310de3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
                            <span>Create Post</span>
                        </a>
                       
                </span>
            </div>
            </div>
        </header>

<section class="back-to-feed-section">
  <div class="back-to-feed-container">

    <a class="back-to-feed-link" href="index.html">← Back to Feed</a>

    <div class="one-post1">

      <div class="post-header">
        <div class="dp-and-name">
          <img class="dp" id="post-avatar" />
          <div class="name-username">
            <h4 id="post-author"></h4>
            <p id="post-username"></p>
          </div>
        </div>
        <p class="post-time">Just now</p>
      </div>

      <div class="post-title-and-desc">
        <p id="post-title"></p>
      </div>

      <div class="post-body-content">
        <p id="post-body"></p>
      </div>

      <div class="likes-comments-share-bookmark">

  <button class="like-button">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
      viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/>
    </svg>
    <span class="like-count">0</span>
  </button>

  <button class="comment-button">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
      viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
    </svg>
    <span class="comment-count">0</span>
  </button>

  <button class="share-button">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
      viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"/>
      <circle cx="6" cy="12" r="3"/>
      <circle cx="18" cy="19" r="3"/>
      <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/>
      <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>
    </svg>
    Share
  </button>

  <button class="bookmark-button">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
      viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

</div>

    </div>

    <p class="comments-headline">
      Comments <span id="comments-count">(0)</span>
    </p>

    <div class="comments-count" id="comments-container"></div>
     <!-- ADD COMMENT FORM -->
    <div class="comments-form">
      <h3>Add a comment</h3>
      <form id="comments-form" class="comment-form">
        <label>Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Comment</label>
        <textarea id="comment" required></textarea>

        <button type="submit" class="post-a-comment">
          Post a Comment
        </button>
      </form>
    </div>
<div class="more-comments">
  <h3>More from this author</h3>
  <div class="more-from-author" id="more-posts-container"></div>
</div>
  </div>
</section>

<footer id="footer">
  <div class="footer-section">
    <p>©️ 2026 DevConnect. Built for learning JavaScript.</p>
  </div>
</footer>
<div id="toast" class="toast"></div>
<script src="back-to-feed.js"></script>
</body>
</html>
